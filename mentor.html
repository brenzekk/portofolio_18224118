<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor OSKM 2024 - BRANDONFLIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background-color: #141414; color: #ffffff; animation: fadeIn 0.6s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hero-detail { height: 70vh; background: linear-gradient(to top, #141414 5%, transparent 60%), url('mentor.jpeg') no-repeat center 20%/cover; display: flex; align-items: flex-end; padding: 4%; }
        .content { padding: 0 4% 50px 4%; max-width: 800px; margin-top: -30px; position: relative; z-index: 10; }
        .title { font-size: 48px; margin-bottom: 15px; font-weight: 700; }
        .meta { display: flex; gap: 15px; color: #fff; font-size: 16px; margin-bottom: 25px; align-items: center; }
        .match { color: #46d369; font-weight: bold; }
        .badge { border: 1px solid #fff; padding: 2px 6px; border-radius: 3px; font-size: 14px; }
        .desc { font-size: 20px; line-height: 1.6; color: #d2d2d2; margin-bottom: 30px; }
        .btn-back { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; background: #e50914; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn-back:hover { background: #b20710; }
    </style>
</head>
<body>
    <div class="hero-detail"></div>
    <div class="content">
        <h1 class="title">Mentor OSKM 2024</h1>
        <div class="meta"><span class="match">99% Match</span><span class="badge">2024</span><span>1 Musim</span></div>
        <p class="desc">Menjadi garda terdepan menyambut mahasiswa baru ITB 2024. Bertanggung jawab menanamkan nilai-nilai dasar kemahasiswaan, memandu adaptasi lingkungan kampus, serta menjadi teladan esensial dalam OSKM.</p>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
    </div>
</body>
</html>
